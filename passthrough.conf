# Settings for single-GPU macOS passthrough. Edit for your machine.
# Find your GPU:  lspci -nn | grep -iE 'vga|audio'

# PCI addresses of the GPU and its HDMI/DP audio function
GPU_VGA="0000:0b:00.0"
GPU_AUDIO="0000:0b:00.1"

# vendor:device IDs (RX 6700 / 6700 XT / 6750 XT = 1002:73df, audio 1002:ab28)
GPU_VGA_ID="1002:73df"
GPU_AUDIO_ID="1002:ab28"

# VM size
VM_RAM_MB=16384
VM_CORES=6
HOST_RESERVE_MB=2048

# Optional CPU pinning (see `lscpu -e`). One host CPU per vCPU, ideally one thread of
# separate physical cores; HOST_CPUS gets QEMU's own threads. Empty = no pinning.
# Example for an 8-core/16-thread CPU (core N = CPUs N and N+8):
#   VM_PIN_CPUS="2 3 4 5 6 7"   HOST_CPUS="0,1,8,9"
VM_PIN_CPUS=""
HOST_CPUS=""
# Optional (AMD amd-pstate-epp): energy preference for the pinned CPUs while the VM runs,
# e.g. "performance" for lower audio latency. Restored on exit. Empty = leave as is.
VM_CPU_EPP=""

# OpenCore image built by build-opencore-image.sh, and the macOS disk (relative to OSX-KVM folder)
OC_IMAGE_DEFAULT="OpenCore/OpenCore-nootrx.qcow2"
MAC_DISK="mac_hdd_ng.img"

# USB devices to hand to macOS when plugged in (vendor:product from lsusb), e.g. keyboard + mouse
USB_DEVICES=()

# Display manager to stop/restart in desktop mode
DISPLAY_MANAGER="display-manager.service"

# Optional: only consider kernels matching this regex for the passthrough GRUB entry (e.g. "cachyos")
KERNEL_MATCH=""

# Optional fixed MAC for the VM's network card (default: derived from /etc/machine-id)
VM_MAC=""
